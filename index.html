<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARROW TAILOR - Perfect Fit, Perfect Style</title>
<style>
  body { margin:0; font-family: Arial; background:#0a0a0a; color:#fff; text-align:center; }
  .header { background:#000; padding:20px; border-bottom:3px solid #C0A050; }
  .logo { font-size:32px; color:#C0A050; font-weight:bold; letter-spacing:3px; }
  .banner { padding:80px 20px; background:#111; }
  .banner h1 { font-size:40px; color:#C0A050; }
  .btn { background:#C0A050; color:#000; padding:15px 35px; border:none; border-radius:6px; font-weight:bold; text-decoration:none; display:inline-white; margin-top:15px; }
  .services { display:grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap:20px; padding:50px 20px; }
  .card { background:#222; border:1px solid #C0A050; border-radius:10px; padding:20px; }
  .card h3 { color:#C0A050; }
  .contact { background:#000; padding:40px 20px; border-top:3px solid #C0A050; }
  .whatsapp { background:#25D366; color:#fff; padding:12px 25px; border-radius:6px; text-decoration:none; }
</style>
</head>
<body>
<header class="header">
  <div class="logo">ARROW TAILOR</div>
  <div>PERFECT FIT, PERFECT STYLE</div>
</header>
</body>
